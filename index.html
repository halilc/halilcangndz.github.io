<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support</title>
  <meta name="description" content="Support page for the app. Contact us for help, questions, or issues." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0f17;
      --card: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.70);
      --border: rgba(255, 255, 255, 0.14);
      --link: #7dd3fc;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7fb;
        --card: #ffffff;
        --text: #0b1220;
        --muted: rgba(11, 18, 32, 0.72);
        --border: rgba(11, 18, 32, 0.12);
        --link: #0369a1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 700px at 10% 10%, rgba(125, 211, 252, 0.22), transparent 60%),
                  radial-gradient(900px 600px at 90% 30%, rgba(167, 139, 250, 0.18), transparent 55%),
                  var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 10px 0;
      line-height: 1.55;
      color: var(--muted);
      font-size: 16px;
    }
    .email {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
    }
    .email span { color: var(--muted); }
    .email a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
      word-break: break-word;
    }
    .email a:hover { text-decoration: underline; }
    .footer {
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Support">
    <h1>Support</h1>
    <p>If you need help, have questions, or would like to report an issue, please contact us.</p>

    <div class="email" aria-label="Support email">
      <span>📧 Email:</span>
      <a href="mailto:halilcangndz@gmail.com">halilcangndz@gmail.com</a>
    </div>

    <p class="footer">We aim to respond to all support requests as quickly as possible.</p>
    <p class="footer">Thank you for playing!</p>
  </main>
</body>
</html>
